<div class="success-container">
  <div class="success-card">
    <div class="checkmark-circle">
      <span class="material-icons checkmark-icon">check_circle</span>
    </div>
    <h1 class="success-title">{{ 'subscriptions.success.title' | translate }}</h1>
    <p class="success-message">{{ 'subscriptions.success.message' | translate }}</p>
    <p class="redirect-notice">{{ 'subscriptions.success.redirectNotice' | translate }}</p>
    <button class="continue-btn" (click)="continueToApp()">
      {{ 'subscriptions.success.continueButton' | translate }}
    </button>
  </div>
</div>
